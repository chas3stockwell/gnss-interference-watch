[project]
name = "gnss-interference-watch"
version = "0.1.0"
description = "Serverless detector for likely GNSS interference, built for Northwestern CS 310."
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared/python"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["shared", "collect", "detect", "alert-show", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gnssiw", "tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_regions.py" = ["E402"]
